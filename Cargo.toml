[package]
name = "linux-oci-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
oci-client = "0.18"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
